[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "endo3reval"
version = "0.1.0"
description = "Run official Endo3R inference on preprocessed SCARED and evaluate it with the official Video Depth Anything protocol."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "Apache-2.0"}
authors = [{name = "C2H5O", email = "903437900@qq.com"}]
dependencies = [
  "numpy>=1.23,<2",
  "opencv-python>=4.7,<5",
  "torch>=2.0",
]

[project.scripts]
endo3reval = "endo3reval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
